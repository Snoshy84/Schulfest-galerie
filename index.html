<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schulfest Fotobox 📸</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 20px 16px; margin: 0; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .gallery-grid { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 0 auto; }
        .photo-card { background-color: #1e293b; border-radius: 12px; overflow: hidden; }
        .photo-card img { width: 100%; display: block; }
        .download-btn { display: block; background-color: #3b82f6; color: white; text-decoration: none; padding: 14px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <h1 id="status-text">Suche eure Fotos... ⏳</h1>
    <div id="gallery" class="gallery-grid"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const galleryContainer = document.getElementById('gallery');
        const statusText = document.getElementById('status-text');

        // Deine exakte Supabase-Adresse
        const supabaseBaseUrl = "https://qiozvobhqhopjzanvjgk.supabase.co/storage/v1/object/public/photos";

        if (!sessionId) {
            statusText.innerText = "❌ Keine Fotositzung im Link gefunden!";
        } else {
            let imagesFound = 0;
            
            for (let i = 0; i < 10; i++) {
                const imgUrl = `${supabaseBaseUrl}/sessions/${sessionId}/${i}.jpg`;
                const img = new Image();
                
                img.onload = function() {
                    imagesFound++;
                    statusText.style.display = 'none'; // Versteckt den Lade-Text
                    
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="Fotobox Bild ${i + 1}">
                        <a class="download-btn" href="${imgUrl}" download target="_blank">⬇️ Bild herunterladen</a>
                    `;
                    galleryContainer.appendChild(card);
                };
                
                img.src = imgUrl; // Startet den Ladevorgang
            }

            // Wenn nach 4 Sekunden gar kein Bild da ist, abbrechen:
            setTimeout(() => {
                if (imagesFound === 0) {
                    statusText.innerText = "❌ Keine Bilder gefunden. Lade die Seite bitte neu.";
                }
            }, 4000);
        }
    </script>
</body>
</html>
