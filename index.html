<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schulfest Fotobox 📸</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 20px 16px; margin: 0; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .gallery-grid { display: flex; flex-direction: column; gap: 20px; max-width: 600px; margin: 0 auto; }
        .photo-card { background-color: #1e293b; border-radius: 12px; overflow: hidden; }
        .photo-card img { width: 100%; display: block; }
        .download-btn { display: block; background-color: #3b82f6; color: white; text-decoration: none; padding: 14px; font-weight: bold; font-size: 16px; }
        
        /* Neues Design für den Lösch-Bereich */
        .delete-section { margin-top: 40px; padding-top: 30px; border-top: 1px solid #334155; display: none; }
        .delete-btn { background-color: #ef4444; color: white; border: none; padding: 14px 20px; border-radius: 12px; font-weight: bold; font-size: 16px; width: 100%; max-width: 600px; cursor: pointer; margin: 0 auto; display: block; }
        .delete-btn:disabled { background-color: #7f1d1d; color: #9ca3af; }
        .success-msg { color: #4ade80; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1 id="status-text">Suche eure Fotos... ⏳</h1>
    <div id="gallery" class="gallery-grid"></div>

    <!-- Neuer Bereich für den Lösch-Button -->
    <div id="delete-section" class="delete-section">
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 12px;">Alle Bilder gesichert?</p>
        <button id="delete-btn" class="delete-btn" onclick="deletePhotos()">🗑️ Fotos jetzt endgültig löschen</button>
    </div>

    <script>
        // ------------------------------------------------------------------
        // HIER DEINEN ANON KEY EINTRAGEN (denselben wie in Xcode):
        const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpb3p2b2JocWhvcGp6YW52amdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNTA0ODYsImV4cCI6MjEwNDcyNjQ4Nn0.6KlubkRGbfwJrl06zUsXb9OR-V1YYfDxiH-tUsiilF8";
        // ------------------------------------------------------------------

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const galleryContainer = document.getElementById('gallery');
        const statusText = document.getElementById('status-text');
        const deleteSection = document.getElementById('delete-section');

        const supabaseBaseUrl = "https://qiozvobhqhopjzanvjgk.supabase.co/storage/v1/object/public/photos";
        const supabaseApiUrl = "https://qiozvobhqhopjzanvjgk.supabase.co/storage/v1/object/photos";

        if (!sessionId) {
            statusText.innerText = "❌ Keine Fotositzung im Link gefunden!";
        } else {
            let imagesFound = 0;
            
            for (let i = 0; i < 10; i++) {
                const imgUrl = `${supabaseBaseUrl}/sessions/${sessionId}/${i}.jpg`;
                const img = new Image();
                
                img.onload = function() {
                    imagesFound++;
                    statusText.style.display = 'none';
                    
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="Fotobox Bild ${i + 1}">
                        <a class="download-btn" href="${imgUrl}" download target="_blank">⬇️ Bild herunterladen</a>
                    `;
                    galleryContainer.appendChild(card);

                    // Lösch-Button einblenden, sobald mindestens 1 Bild da ist
                    deleteSection.style.display = 'block';
                };
                
                img.src = imgUrl;
            }

            setTimeout(() => {
                if (imagesFound === 0) {
                    statusText.innerText = "❌ Keine Bilder gefunden. Wurden sie vielleicht schon gelöscht?";
                }
            }, 4000);
        }

        // --- NEUE FUNKTION: BILDER LÖSCHEN ---
        async function deletePhotos() {
            if (!confirm("Bist du sicher? Die Fotos werden sofort und für immer vom Server gelöscht!")) return;
            
            const btn = document.getElementById('delete-btn');
            btn.innerText = "Lösche Daten... ⏳";
            btn.disabled = true;

            // Wir schicken für jedes mögliche Bild einen Löschbefehl
            for (let i = 0; i < 10; i++) {
                const deleteUrl = `${supabaseApiUrl}/sessions/${sessionId}/${i}.jpg`;
                
                await fetch(deleteUrl, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${supabaseAnonKey}`,
                        'apikey': supabaseAnonKey
                    }
                });
            }
            
            // UI aufräumen und Erfolgsmeldung zeigen
            galleryContainer.innerHTML = "";
            deleteSection.innerHTML = `
                <div class="success-msg">✅ Fotos erfolgreich gelöscht!</div>
                <p style="color: #94a3b8; margin-top: 10px;">Ihr könnt diese Seite jetzt schließen. Viel Spaß noch auf dem Schulfest!</p>
            `;
        }
    </script>
</body>
</html>
