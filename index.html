<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schulfest Fotobox 📸</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 24px 16px;
            margin: 0;
        }
        h1 { font-size: 26px; margin-bottom: 6px; font-weight: 800; }
        p.subtitle { font-size: 15px; color: #94a3b8; margin-top: 0; margin-bottom: 24px; }
        .gallery-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .photo-card {
            background-color: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .photo-card a.download-btn {
            display: block;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 12px;
            font-weight: 600;
            font-size: 15px;
        }
        .loading { font-size: 18px; color: #cbd5e1; margin-top: 40px; }
    </style>
</head>
<body>

    <h1>Eure Fotos sind da! 🎉</h1>
    <p class="subtitle">Tippe auf "Bild herunterladen" oder halte das Foto gedrückt.</p>

    <div id="loading" class="loading">Lade Fotos...</div>
    <div id="gallery" class="gallery-grid"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
const sessionId = urlParams.get('session');
const galleryContainer = document.getElementById('gallery');
const loadingText = document.getElementById('loading');

// WICHTIG: Deine feste Supabase-Adresse
const supabaseBaseUrl = "https://qiozvobhqhopjzanvjgk.supabase.co/storage/v1/object/public/photos";

if (!sessionId) {
    loadingText.innerText = "Keine Fotositzung gefunden!";
} else {
    loadingText.style.display = 'none';

    for (let i = 0; i < 10; i++) {
        const imgUrl = `${supabaseBaseUrl}/sessions/${sessionId}/${i}.jpg`;
        
        const img = new Image();
        img.src = imgUrl;
        img.onload = function() {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="${imgUrl}" alt="Fotobox Bild ${i + 1}">
                <a class="download-btn" href="${imgUrl}" download="Fotobox_${i + 1}.jpg" target="_blank">⬇️ Bild herunterladen</a>
            `;
            galleryContainer.appendChild(card);
        };
    }
}</html>
